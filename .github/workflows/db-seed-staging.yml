name: Seed staging database

# Applies supabase/seed.sql (idempotent demo shop seed) to the hosted staging Supabase project.
# Run after "Migrate staging database": it refuses to seed while migrations are pending on staging.
# Manual only, restricted to the `staging` branch.
# Uses repository secrets (not GitHub Environments, which require paid plans on private repositories).
# Runbook: docs/DEPLOYMENT.md
on:
  workflow_dispatch:

permissions:
  contents: read

# Shared with "Migrate staging database" so a seed waits for a running migration.
concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  seed:
    name: Seed staging database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse non-staging branch
        if: ${{ github.ref != 'refs/heads/staging' }}
        run: |
          echo "::error::This workflow only runs on refs/heads/staging (got: $GITHUB_REF)."
          exit 1

      - name: Verify required secrets
        env:
          PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          missing=0
          for name in PROJECT_REF ACCESS_TOKEN DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret STAGING_SUPABASE_${name}."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # The --remote flags below were checked against 3.1.0 (the devcontainer CLI).
          version: 3.1.0

      - name: Link staging Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # The seed targets the latest schema; seeding a staging DB that misses migrations fails midway
      # (for example the 2026-11-26 run, where the promotion merged after the migration had run).
      - name: Refuse when migrations are pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          out="$(supabase db push --remote --dry-run --agent no 2>&1)" || {
            echo "::error::Migration history check failed. Run \"Migrate staging database\" on staging first."
            printf '%s\n' "$out" | sed -E 's#(postgres(ql)?://)[^@ ]+@#\1***@#g'
            exit 1
          }
          if ! grep -q "Remote database is up to date" <<<"$out"; then
            echo "::error::Migrations are pending on staging. Run \"Migrate staging database\" on staging first."
            printf '%s\n' "$out" | sed -E 's#(postgres(ql)?://)[^@ ]+@#\1***@#g'
            exit 1
          fi
          echo "Staging schema is up to date."

      - name: Log database user
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: supabase db query --remote --read-only --agent no "select current_user"

      - name: Apply staging seed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: supabase db query --remote --yes --agent no -f supabase/seed.sql

      - name: Verify seeded demo business
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          result="$(supabase db query --remote --read-only --output-format json --agent no \
            "select exists (select 1 from public.businesses where id = '11111111-1111-4111-8111-111111111111'::uuid) as has_business, exists (select 1 from public.products where business_id = '11111111-1111-4111-8111-111111111111'::uuid) as has_products;")"
          if [ -z "$result" ]; then
            echo "::error::Seed verification query returned empty output."
            exit 1
          fi
          ok="$(printf '%s\n' "$result" | jq -r '
            (if type == "array" then .[0] elif (.rows | type) == "array" then .rows[0] else error("unexpected response shape") end)
            | (.has_business == true and .has_products == true)
          ')"
          if [ "$ok" != "true" ]; then
            echo "::error::Seed verification failed: demo business 11111111-1111-4111-8111-111111111111 or its products are missing."
            printf '%s\n' "$result"
            exit 1
          fi
          echo "Verified demo business 11111111-1111-4111-8111-111111111111 exists with at least one product."
