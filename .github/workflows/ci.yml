name: CI

on:
  pull_request:
    branches: [develop, staging, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Quality Gate: Code Formatting ───────────────────────────
  format:
    name: Quality Gate - Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

  # ── Quality Gate: ESLint ────────────────────────────────────
  lint:
    name: Quality Gate - ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint check
        run: npm run lint

  # ── Quality Gate: Strict TypeScript ─────────────────────────
  typecheck:
    name: Quality Gate - Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check database types are up to date
        run: npm run db:types:check

  # ── Quality Gate: Unit Tests & Coverage Ratchet ─────────────
  test:
    name: Quality Gate - Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  # ── Quality Gate: Tooling Validation ────────────────────────
  tooling:
    name: Quality Gate - Tooling Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tooling tests
        run: npm run test:tooling

  # ── Quality Gate: Next.js Build & Dependency Audit ──────────
  build:
    name: Quality Gate - Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Next.js production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          DATA_SOURCE: supabase
        run: npm run build

  # ── Quality Gate: Playwright & Accessibility ────────────────
  e2e:
    name: Quality Gate - Playwright & Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Quality Gate: Database Tests (pgTAP) ───────────────────
  db-tests:
    name: Quality Gate - Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder-google-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.0.0

      - name: Start Supabase local DB
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,mailpit

      - name: Run pgTAP database tests
        run: npm run db:test

      - name: Run Supabase adapter live contract tests
        run: |
          eval "$(supabase status -o env 2>/dev/null | grep -E '^[A-Z0-9_]+=')"
          SUPABASE_TEST_URL="$API_URL" SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SUPABASE_TEST_ANON_KEY="$ANON_KEY" npm run test:live

      - name: Dump Supabase Realtime logs on failure
        if: failure()
        run: |
          echo "=== Supabase Containers ==="
          docker ps -a
          echo "=== Realtime Container Logs ==="
          docker logs $(docker ps -q -f name=realtime) --tail 150 2>&1 || true

  # ── Quality Gate: Consolidated Summary Gate ─────────────────
  summary:
    name: Quality Gate - Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [format, lint, typecheck, test, tooling, build, e2e, db-tests]
    if: always()
    env:
      FORMAT: ${{ needs.format.result }}
      LINT: ${{ needs.lint.result }}
      TYPECHECK: ${{ needs.typecheck.result }}
      TEST: ${{ needs.test.result }}
      TOOLING: ${{ needs.tooling.result }}
      BUILD: ${{ needs.build.result }}
      E2E: ${{ needs.e2e.result }}
      DB_TESTS: ${{ needs.db-tests.result }}
    steps:
      - name: Write job summary
        run: |
          {
            echo "## Quality Gate"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Formatting | $FORMAT |"
            echo "| ESLint | $LINT |"
            echo "| Typecheck | $TYPECHECK |"
            echo "| Unit Tests & Coverage | $TEST |"
            echo "| Tooling Validation | $TOOLING |"
            echo "| Build & Security Audit | $BUILD |"
            echo "| Playwright & Accessibility | $E2E |"
            echo "| Database Tests | $DB_TESTS |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce quality gate
        run: |
          for result in "$FORMAT" "$LINT" "$TYPECHECK" "$TEST" "$TOOLING" "$BUILD" "$E2E" "$DB_TESTS"; do
            if [ "$result" != "success" ]; then
              echo "::error::One or more CI quality checks failed."
              exit 1
            fi
          done
