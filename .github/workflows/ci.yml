name: CI

# Tiered, scope-aware and stack-aware quality gate. Minutes are the scarce resource (private repo,
# free plan, every job billed rounded UP to the minute), so: one `npm ci` per job, few jobs, and
# the expensive tiers only run when the change and the PR's position in its stack need them.
#
#   check        every run. Secret scan, PR title, format, lint, typecheck, unit tests + coverage,
#                npm audit, db-types and tooling tests when scoped. Also decides the scope.
#   integration  one local Supabase: pgTAP, live contract tests, production build, Supabase-mode journey.
#   e2e          mock-mode Playwright suite (+ axe).
#   summary      the ONE required status check ("Quality Gate - Summary"); see its comments.
#
# Scope comes from scripts/ci-scope.mjs, the same rules `npm run gate` uses locally.
# Docs: docs/CONTRIBUTING.md#ci-tiers-and-cost
on:
  pull_request:
    # No `branches:` filter: PRs stacked on a feature branch still get the cheap `check` tier.
    # `edited` is needed to see a retarget (changes.base) when the bottom of a stack merges;
    # every `edited` run is a real run (a skipped Summary would mask an earlier failing one).
    types: [opened, synchronize, reopened, edited]
  push:
    # Post-merge: skipped work when the merge commit's tree equals the PR head already verified;
    # otherwise judges the merge diff (before..after) with the same scope rules.
    branches: [develop, staging, main]
  workflow_dispatch: # manual: every tier, e.g. `gh workflow run ci.yml --ref <branch>`

permissions:
  contents: read

concurrency:
  # One run per PR (a push supersedes the previous run); every push to a protected branch has its
  # own group and is never cancelled, so a back-to-back merge cannot skip a merge diff.
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # ── Tier 1: always. Decides the scope for the other tiers. ──
  check:
    name: Quality Gate - Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      integration: ${{ steps.scope.outputs.integration }}
      int_db: ${{ steps.scope.outputs.int_db }}
      int_build: ${{ steps.scope.outputs.int_build }}
      int_journey: ${{ steps.scope.outputs.int_journey }}
      e2e: ${{ steps.scope.outputs.e2e }}
      deferred: ${{ steps.scope.outputs.deferred }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      # Full history (small repo, a few seconds): the scope needs merge-bases, and the stack check
      # needs to see which remote branches contain the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Decide scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) node scripts/ci-scope.mjs --pr "$BASE_REF" "$HEAD_SHA" "$HEAD_REF" --github-output ;;
            push) node scripts/ci-scope.mjs --push "$BEFORE" --github-output ;;
            *) node scripts/ci-scope.mjs --all --github-output ;;
          esac

      # No dependencies needed: run these before the install so they report even if it fails.
      - name: Secret scan (added lines of the diff)
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.scope.outputs.base }}
        run: node scripts/secret-scan.mjs --base "$BASE"

      - name: PR title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|refactor|docs|test|chore|ci|build|perf|style)(\([a-zA-Z0-9_./-]+\))?: .+'
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title '$TITLE' must match '<type>(<scope>): <description>' (optionally ending in ' (#<issue>)')."
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ steps.scope.outputs.tooling == 'true' }}
        with:
          python-version: "3.11"

      - name: Install dependencies
        id: install
        run: npm ci

      # From here every step runs even if an earlier one failed (but not after `npm ci` failed or the
      # run was cancelled), so one push reveals every failure instead of one per push.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.format_only != 'true' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.format_only != 'true' }}
        run: npm run typecheck

      - name: Database types are up to date
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.db_types == 'true' }}
        run: npm run db:types:check

      - name: Unit tests with coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.unit == 'true' }}
        run: npm run test:coverage

      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.format_only != 'true' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Tooling tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.tooling == 'true' }}
        run: npm run test:tooling

  # ── Tier 2: one local Supabase for everything that needs it. ──
  # The storefront prerenders its catalog at build time and a failed read fails the build (no mock
  # fallback), so the build runs against the seeded local stack. CI needs no secrets.
  integration:
    name: Quality Gate - Integration
    needs: check
    if: ${{ needs.check.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder-google-secret
      INT_DB: ${{ needs.check.outputs.int_db }}
      INT_BUILD: ${{ needs.check.outputs.int_build }}
      INT_JOURNEY: ${{ needs.check.outputs.int_journey }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0

      - name: Start Supabase local stack
        id: supabase
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,mailpit

      - name: Pick Playwright version
        id: pw
        if: ${{ env.INT_JOURNEY == 'true' }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Caches are written by develop runs only (PR-scoped entries would pile up against the 5 GB
      # repo limit); PR runs read develop's entry.
      - name: Restore Playwright browsers
        id: pw-cache
        if: ${{ env.INT_JOURNEY == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright (system deps only on a cache hit)
        if: ${{ env.INT_JOURNEY == 'true' }}
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: Save Playwright browsers
        if: ${{ success() && env.INT_JOURNEY == 'true' && github.ref == 'refs/heads/develop' && steps.pw-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: pgTAP database tests
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' && env.INT_DB == 'true' }}
        run: npm run db:test

      - name: Supabase adapter live contract tests
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' && env.INT_DB == 'true' }}
        run: |
          eval "$(supabase status -o env 2>/dev/null | grep -E '^[A-Z0-9_]+=')"
          SUPABASE_TEST_URL="$API_URL" SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SUPABASE_TEST_ANON_KEY="$ANON_KEY" npm run test:live

      # Key on the lockfile only: a per-source-hash key would write a new multi-hundred-MB entry
      # every run. The restore key reuses the newest entry; only develop saves, only when the lockfile changed.
      - name: Restore Next.js build cache
        id: next-cache
        if: ${{ env.INT_BUILD == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Production build against the local stack
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' && env.INT_BUILD == 'true' }}
        run: npm run build:local

      - name: Save Next.js build cache
        if: ${{ success() && env.INT_BUILD == 'true' && github.ref == 'refs/heads/develop' && steps.next-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Anonymous storefront journey against local Supabase
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' && env.INT_JOURNEY == 'true' }}
        run: npm run test:e2e:supabase

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-supabase-results
          path: |
            playwright-report-supabase/
            test-results-supabase/
          retention-days: 7

      - name: Dump Supabase Realtime logs on failure
        if: ${{ failure() }}
        run: |
          echo "=== Supabase Containers ==="
          docker ps -a
          echo "=== Realtime Container Logs ==="
          docker logs $(docker ps -q -f name=realtime) --tail 150 2>&1 || true

  # ── Tier 3: mock-mode Playwright + accessibility. ──
  e2e:
    name: Quality Gate - E2E
    needs: check
    if: ${{ needs.check.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pick Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright (system deps only on a cache hit)
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: Save Playwright browsers
        if: ${{ success() && github.ref == 'refs/heads/develop' && steps.pw-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Not sharded: a second job repeats checkout, npm ci and the browser install (~1.5 min billed)
      # to save about half of a 3 to 4 minute suite, i.e. more billed minutes, not fewer.
      # Both projects (mobile: whole suite; desktop: @desktop subset), one dev server, one worker.
      - run: npm run test:e2e

      # A test that failed once and passed on retry is flaky: list it where reviewers look.
      - name: Report flaky tests
        id: flaky
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "test-results/results.json";
            if (!fs.existsSync(file)) process.exit(0);
            const flaky = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? [])
                for (const test of spec.tests ?? [])
                  if (test.status === "flaky") flaky.push(`${test.projectName}: ${suite.file ?? ""} ${spec.title}`);
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of JSON.parse(fs.readFileSync(file, "utf8")).suites ?? []) walk(suite);
            if (flaky.length === 0) process.exit(0);
            const lines = ["### Flaky e2e tests (passed only on retry)", "", ...flaky.map((t) => `- ${t}`)];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "found=true\n");
          '

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() || steps.flaky.outputs.found == 'true' }}
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── The single required status check. ──
  # Must never be skipped (a skipped required check blocks, or passes vacuously and masks an earlier
  # failing run on the same SHA), hence `if: always()`. Verdict, per tier result:
  #   success                 ok
  #   skipped, not required   ok (the scope said the tier is not needed, or the check job failed:
  #                           then `check` itself is not success and the gate fails below)
  #   skipped, required       FAIL (a tier the scope asked for did not run)
  #   failure / cancelled     FAIL (cancelled is a failure: a half-run gate proves nothing)
  summary:
    name: Quality Gate - Summary
    needs: [check, integration, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHECK: ${{ needs.check.result }}
      INTEGRATION: ${{ needs.integration.result }}
      E2E: ${{ needs.e2e.result }}
      INTEGRATION_REQUIRED: ${{ needs.check.outputs.integration }}
      E2E_REQUIRED: ${{ needs.check.outputs.e2e }}
      DEFERRED: ${{ needs.check.outputs.deferred }}
      REASON: ${{ needs.check.outputs.reason }}
    steps:
      - name: Enforce quality gate
        run: |
          failed=0
          verdict() { # name result required
            case "$2" in
              success) echo "| $1 | $2 |" ;;
              skipped)
                if [ "$3" = "true" ]; then echo "| $1 | skipped but required: FAIL |"; failed=1
                else echo "| $1 | skipped (not needed) |"; fi ;;
              *) echo "| $1 | $2: FAIL |"; failed=1 ;;
            esac
          }
          {
            echo "## Quality Gate"
            echo
            echo "Scope: $REASON"
            if [ "$DEFERRED" = "true" ]; then
              echo
              echo "Integration/e2e were needed by this diff but are deferred: they run when this PR targets develop or sits on top of its stack."
            fi
            echo
            echo "| Tier | Result |"
            echo "| --- | --- |"
            verdict "Check" "$CHECK" true
            verdict "Integration" "$INTEGRATION" "$INTEGRATION_REQUIRED"
            verdict "E2E" "$E2E" "$E2E_REQUIRED"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -ne 0 ]; then
            echo "::error::A quality tier failed, was cancelled, or was required but did not run. See the job summary."
            exit 1
          fi
