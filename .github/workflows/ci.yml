name: CI

on:
  pull_request:
    branches: [develop, staging, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, staging, main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Quality Gate: Code Formatting ───────────────────────────
  format:
    name: Quality Gate - Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

  # ── Quality Gate: ESLint ────────────────────────────────────
  lint:
    name: Quality Gate - ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint check
        run: npm run lint

  # ── Quality Gate: Strict TypeScript ─────────────────────────
  typecheck:
    name: Quality Gate - Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ── Quality Gate: Unit Tests & Coverage Ratchet ─────────────
  test:
    name: Quality Gate - Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 2

  # ── Quality Gate: Tooling Validation ────────────────────────
  tooling:
    name: Quality Gate - Tooling Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tooling tests
        run: npm run test:tooling

  # ── Quality Gate: Next.js Build & Dependency Audit ──────────
  build:
    name: Quality Gate - Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Next.js production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          DATA_SOURCE: supabase
        run: npm run build

  e2e:
    name: Quality Gate - Playwright & Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Quality Gate: Consolidated Summary Gate ─────────────────
  summary:
    name: Quality Gate - Summary
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test, tooling, build, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download test coverage artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage
          path: coverage

      - name: Render CI quality report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          FORMAT_STATUS: ${{ needs.format.result }}
          LINT_STATUS: ${{ needs.lint.result }}
          TYPECHECK_STATUS: ${{ needs.typecheck.result }}
          TEST_STATUS: ${{ needs.test.result }}
          TOOLING_STATUS: ${{ needs.tooling.result }}
          BUILD_STATUS: ${{ needs.build.result }}
          E2E_STATUS: ${{ needs.e2e.result }}
        run: |
          node .github/.scripts/generate-ci-comments.js --save-report /tmp/ci-report
          node .github/.scripts/generate-ci-comments.js || true

      - name: Upload rendered CI report artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ci-report
          path: |
            /tmp/ci-report/comment.md
            /tmp/ci-report/pr_number.txt
          retention-days: 2

      - name: Enforce quality gate
        run: |
          if [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.tooling.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::One or more CI quality checks failed."
            exit 1
          fi
